<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Similarity Graph</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --page: #f9f9f7;
      --surface: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --hairline: #e1e0d9;
      --border: rgba(11, 11, 11, 0.10);
      --cat: #2a78d6;
      --dog: #eb6834;
      --focus: #2a78d6;
      --edge-mix: 0.22;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --text-primary: #f0efec;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --hairline: #2c2c2a;
        --border: rgba(255, 255, 255, 0.10);
        --cat: #3987e5;
        --dog: #d95926;
        --focus: #3987e5;
        --edge-mix: 0.28;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --cat: #3987e5;
      --dog: #d95926;
      --focus: #3987e5;
      --edge-mix: 0.28;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--page);
      color: var(--text-primary);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 20px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--hairline);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    header label { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
    header select, header input[type=range] { accent-color: var(--focus); }
    header select {
      font: inherit;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      max-width: 220px;
    }
    header output { color: var(--text-primary); font-variant-numeric: tabular-nums; min-width: 3.2em; }
    #stats { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    main { flex: 1; display: flex; min-height: 0; }
    #stage { position: relative; flex: 1; min-width: 0; background: var(--surface); }
    #stage canvas { display: block; width: 100%; height: 100%; outline: none; }

    #legend {
      position: absolute;
      left: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      pointer-events: none;
    }
    #legend div { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

    #hint {
      position: absolute;
      right: 16px;
      bottom: 16px;
      color: var(--text-muted);
      font-size: 12px;
      pointer-events: none;
    }

    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      width: 132px;
    }
    #tooltip img { display: block; width: 120px; height: 120px; border-radius: 4px; object-fit: cover; }
    #tooltip .name { margin-top: 4px; font-weight: 600; }
    #tooltip .sub { color: var(--text-secondary); font-size: 12px; }

    aside {
      width: 320px;
      flex: none;
      border-left: 1px solid var(--hairline);
      overflow-y: auto;
      padding: 16px;
    }
    aside h2 { font-size: 15px; margin: 0 0 4px; }
    aside .sub { color: var(--text-secondary); }
    aside .muted { color: var(--text-muted); }
    aside dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0; }
    aside dt { color: var(--text-secondary); }
    aside dd { margin: 0; font-variant-numeric: tabular-nums; }
    #selImg { width: 160px; height: 160px; border-radius: 8px; display: block; margin-bottom: 10px; object-fit: cover; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    button.link {
      font: inherit;
      color: var(--text-secondary);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
    }
    #neighbors { list-style: none; margin: 8px 0 0; padding: 0; }
    #neighbors li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px;
      border-radius: 6px;
      cursor: pointer;
    }
    #neighbors li:hover, #neighbors li:focus-visible { background: var(--hairline); outline: none; }
    #neighbors img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; flex: none; }
    #neighbors .val { font-weight: 600; font-variant-numeric: tabular-nums; }
    #neighbors .lbl { color: var(--text-secondary); font-size: 12px; }

    #error { padding: 24px; color: var(--text-secondary); }
    #error code { color: var(--text-primary); }

    @media (max-width: 760px) {
      main { flex-direction: column; }
      #stage { flex: 1 1 55%; }
      aside { width: auto; flex: 1 1 45%; border-left: none; border-top: 1px solid var(--hairline); }
      #hint { display: none; }
      #stats { margin-left: 0; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>Pet Similarity Graph</h1>
    <label>Highlight
      <select id="breed"><option value="-1">None (color by species)</option></select>
    </label>
    <label>Min cosine
      <input type="range" id="threshold" step="0.005">
      <output id="thresholdOut"></output>
    </label>
    <label><input type="checkbox" id="showEdges" checked> Edges</label>
    <label><input type="checkbox" id="rotate"> Auto-rotate</label>
    <span id="stats"></span>
  </header>
  <main>
    <div id="stage">
      <div id="legend"></div>
      <div id="tooltip"><img alt=""><div class="name"></div><div class="sub"></div></div>
      <div id="hint">Drag to rotate · scroll to zoom · click an image</div>
    </div>
    <aside id="panel"></aside>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
